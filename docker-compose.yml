services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ionity-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (agents publish here)
      - "9001:9001"   # MQTT over WebSocket (browser/dashboard if subscribing directly)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
