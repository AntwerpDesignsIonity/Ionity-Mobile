# Mosquitto broker for Ionity-CSI.
# Default dev configuration: anonymous access on the local network.
# For production, enable authentication (password_file) and TLS listeners.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type notice
log_type information

# Native MQTT (agents: ESP32, Android, Linux-Nexmon, server)
listener 1883
protocol mqtt

# MQTT over WebSocket (optional direct browser subscription)
listener 9001
protocol websockets

# Dev only — lock this down before exposing the broker beyond localhost.
allow_anonymous true
